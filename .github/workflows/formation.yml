name: Formation CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Déployer en prod # Dans Actions / [Pipeline name] / Run workflow (bouton vert)
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.14"


jobs:
  python-lint:
    # if: false # pour désactiver
    defaults:
      run:
        working-directory: back
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: | # Le cache ne tient pas compte de working directory
            ./back/requirements-dev.txt
            ./back/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --config "src=['.']" # A faire tourner dans back en local
  
  js-lint:
    if: false # pour désactiver
    defaults:
      run:
        working-directory: front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lint JS
        run: npx --yes eslint@9 .
      - name: Lint HTML
        run: npx --yes htmlhint "**/*.html"
  
  tests-coverage:
    needs: python-lint
    defaults:
        run:
          working-directory: back
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      MY_SECRET: ${{secrets.MY_SECRET}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: | # Le cache ne tient pas compte de working directory
            ./back/requirements-dev.txt
            ./back/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: cp config-staging.py config.py
      - run: |
          coverage run --source=. -m unittest tests -v
          coverage report
          coverage html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: back/htmlcov
  
  security:
    needs: tests-coverage
    defaults:
      run:
        working-directory: back
    runs-on: ubuntu-latest
    continue-on-error: true
    steps :
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: | # Le cache ne tient pas compte de working directory
            ./back/requirements-dev.txt
            ./back/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m bandit .
      - run: pip-audit -r requirements.txt

  build-whl:
    needs: [security]
    defaults:
     run:
       working-directory: back
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      whl: ${{ steps.name.outputs.whl }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install build
      - run: python -m build --wheel
      - id: name
        run: echo "whl=$(basename dist/*.whl)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: back/dist/*.whl
          retention-days: 2

  deploy-prod:
    needs: build-whl
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: ${{ vars.APP_URL }}
    concurrency: deploy-prod
    defaults:
      run:
        working-directory: .      # pas de back/ ici : on déploie juste un fichier
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: back/dist/*.whl
          target: /opt/mon-api/releases/  # Copie le WHL dans ce répertoire
          strip_components: 1
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            /opt/mon-api/venv/bin/pip install --force-reinstall \
              /opt/mon-api/releases/${{ needs.build-whl.outputs.whl }}  
            sudo systemctl restart mon-api

  build-docker:
    needs: build-whl
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: back/dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: back
          push: true
          build-args: WHL=${{ needs.build-whl.outputs.whl }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}


