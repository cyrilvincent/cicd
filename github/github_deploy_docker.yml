env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ... lint, unit-tests, security, working_directory ...

  # PR vers main : on vérifie seulement que l'image se construit
  build-check:
    needs: [unit-tests, security]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  # DELIVERY : build, smoke test, push
  build-image:
    needs: [unit-tests, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha: ${{ steps.meta.outputs.sha }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "image=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
        run: docker compose build

      - name: Smoke test /health
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
        run: |
          docker compose up -d
          curl -sf --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/health | grep -q true

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêt
        if: always()
        run: docker compose down

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
        run: docker compose push