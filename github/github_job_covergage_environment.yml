  tests-coverage:
    needs: python-lint
    defaults:
        run:
          working-directory: back
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      MY_SECRET: ${{secrets.MY_SECRET}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: | # Le cache ne tient pas compte de working directory
            ./back/requirements-dev.txt
            ./back/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: cp config-staging.py config.py
      - run: |
          coverage run --source=. -m unittest tests -v
          coverage report
          coverage html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: back/htmlcov