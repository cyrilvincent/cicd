  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true   # informatif ; retire-le pour bloquer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install pip-audit
      - name: Scan des dépendances
        run: pip-audit -r requirements.txt --desc --format columns
      - name: Rapport JSON
        if: always()
        run: pip-audit -r requirements.txt --format json -o pip-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.json
          retention-days: 7