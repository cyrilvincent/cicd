name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    concurrency: deploy-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copier le code
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          rsync -az --delete \
            --exclude 'unittests.py' --exclude '__pycache__' --exclude '*.pyc' \
            -e "ssh -i ~/.ssh/id_deploy" \
            back/ "$SSH_USER@$SSH_HOST:/opt/mon-api/releases/$SHORT/"

      - name: Installer et redémarrer
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -e
          cd /opt/mon-api/releases/$SHORT
          /opt/mon-api/venv/bin/pip install -r requirements.txt
          ln -sfn /opt/mon-api/releases/$SHORT /opt/mon-api/current
          sudo systemctl restart mon-api
          ls -1dt /opt/mon-api/releases/* | tail -n +6 | xargs -r rm -rf
          EOF
