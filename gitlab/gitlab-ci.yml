stages:
  - lint
  - test
  - build
  - deploy

# Évite les pipelines en double (branche + merge request)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: python:3.12-slim
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# --- Qualité du code ---------------------------------------------------------
lint:
  stage: lint
  script:
    - pip install ruff
    - ruff check .

# --- Tests unitaires (fichier unittests.py) -----------------------------------
unit-tests:
  stage: test
  before_script:
    - pip install -r requirements.txt pytest pytest-cov httpx
  script:
    - pytest unittests.py --junitxml=report.xml --cov=. --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# --- Sécurité (n'empêche pas le pipeline de continuer) -------------------------
security:
  stage: test
  script:
    - pip install pip-audit bandit
    - pip-audit -r requirements.txt
    - bandit -q -r . -x ./unittests.py,./.cache
  allow_failure: true

dependency-scan:
  stage: test
  script:
    - pip install pip-audit
    - pip-audit -r requirements.txt --desc
    - pip-audit -r requirements.txt --format json -o pip-audit.json || true
  artifacts:
    when: always
    paths:
      - pip-audit.json
    expire_in: 1 week
  allow_failure: true

dependency-scan-front:
  stage: test
  image: node:22-slim
  script:
    - npm ci
    - npm audit --omit=dev --audit-level=high
    - npm audit --omit=dev --json > npm-audit.json || true
  artifacts:
    when: always
    paths:
      - npm-audit.json
    expire_in: 1 week
  allow_failure: true

# --- Image Docker, publiée dans le registre GitLab ----------------------------
build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Déploiement manuel (à adapter à ton serveur) -----------------------------
deploy:
  stage: deploy
  script:
    - echo "Déploiement de $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Exemple : ssh user@serveur "docker compose pull && docker compose up -d"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
